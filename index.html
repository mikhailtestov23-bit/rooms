<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms</title>
  </head>
  <body>
    <main id="app">
      <div id="hud" aria-live="polite">
        <span id="roomLabel">Комната 1 / 6</span>
        <span id="distanceLabel">0%</span>
      </div>
      <div id="roomJumpTools" aria-label="Быстрый выбор комнаты для теста">
        <span>Тест</span>
        <button type="button" data-room-jump="1" aria-label="Перейти в комнату 1">1</button>
        <button type="button" data-room-jump="2" aria-label="Перейти в комнату 2">2</button>
        <button type="button" data-room-jump="3" aria-label="Перейти в комнату 3">3</button>
        <button type="button" data-room-jump="4" aria-label="Перейти в комнату 4">4</button>
        <button type="button" data-room-jump="5" aria-label="Перейти в комнату 5">5</button>
        <button type="button" data-room-jump="6" aria-label="Перейти в комнату 6">6</button>
      </div>
      <div id="characterTools">
        <button id="modelButton" type="button" aria-label="Выбрать VRM" title="Выбрать VRM">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3v12" />
            <path d="m7 8 5-5 5 5" />
            <path d="M5 15v4h14v-4" />
          </svg>
        </button>
        <button id="rotateModelButton" type="button" aria-label="Развернуть персонажа" title="Развернуть персонажа" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 12a8 8 0 0 1 13.7-5.7" />
            <path d="M18 2v5h-5" />
            <path d="M20 12a8 8 0 0 1-13.7 5.7" />
            <path d="M6 22v-5h5" />
          </svg>
        </button>
        <button id="resetModelButton" type="button" aria-label="Вернуть запасного персонажа" title="Вернуть запасного персонажа" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 7h12" />
            <path d="M9 7V5h6v2" />
            <path d="m9 10 .5 9" />
            <path d="m15 10-.5 9" />
            <path d="M8 7h8l-1 14H9L8 7Z" />
          </svg>
        </button>
      </div>
      <input id="modelInput" type="file" accept=".vrm,.glb,model/gltf-binary" />
      <div id="modelStatus" aria-live="polite" hidden></div>
      <div id="moveStick" aria-hidden="true">
        <div id="moveKnob"></div>
      </div>
      <div id="startOverlay">
        <button id="startButton" type="button">press to start</button>
      </div>
    </main>
    <script type="module" src="/src/main.js?v=player-ui-clean-2"></script>
  </body>
</html>
